[project]
name = "rc-aircraft-design"
version = "0.1.0"
description = "RC aircraft design & manufacturing: aero analysis, wing geometry, stability, propulsion, 3D viz, and CAD export"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
viz = ["PyOpenGL>=3.1", "PyOpenGL-accelerate>=3.1", "glfw>=2.6"]
cad = ["ezdxf>=0.18"]
cad-import = ["cadquery>=2.7"]
julia = ["juliacall>=0.9"]
aero = ["xfoil>=1.1", "aerosandbox>=4.2", "neuralfoil>=0.1"]
webui = ["dash>=4.0", "dash-bootstrap-components>=2.0", "dash-iconify>=0.1", "plotly>=6.0", "pandas>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.3"]
all = ["rc-aircraft-design[plot,viz,cad,cad-import,julia,aero,webui,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rc_aircraft_design"]

# JSON catalogue files are included automatically because they live inside
# the rc_aircraft_design package. Do not force-include catalog_data here:
# doing so adds the same file twice to the wheel archive.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
