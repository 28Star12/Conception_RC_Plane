name: Tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project, web UI and test dependencies
        run: uv sync --extra dev --extra webui

      - name: Run test suite
        run: uv run pytest -q

      - name: Import Dash application and registered pages
        working-directory: webui
        run: uv run --project .. python -c "import app; import pages.builder; print('Dash app and 3D builder loaded')"
